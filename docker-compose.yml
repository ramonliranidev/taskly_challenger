services:
  db:
    image: postgres:16-alpine
    container_name: taskly_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-taskly}
      POSTGRES_USER: ${DB_USERNAME:-taskly}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-taskly}
    ports:
      - "5432:5432"
    volumes:
      - taskly_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-taskly}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskly_backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "composer install --no-interaction --prefer-dist --no-progress && php artisan migrate --force && php artisan storage:link && php artisan serve --host=0.0.0.0 --port=8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskly_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    depends_on:
      - backend
    command: sh -c "npm install && npm run start -- --host 0.0.0.0"

volumes:
  taskly_db_data:
